name: Enviar resumo do Focus

# Dispara quando o workflow "Resumo do Focus" termina bem -- não por push.
#
# A versão anterior escutava `push` em output/focus/focus_*.md, e isso nunca
# poderia funcionar por dois motivos somados: nenhum .md jamais existiu neste
# repositório (os boletins históricos eram .html, commitados à mão), e agora
# que um workflow escreve o .md, o push vem do GITHUB_TOKEN padrão -- que,
# por desenho do GitHub, não dispara outros workflows.
#
# O HTML do e-mail é montado pelo código a partir do histórico já validado --
# o agente escreve texto, nunca tabela.
#
# `workflow_run` dispara na CONCLUSÃO do "Resumo do Focus", inclusive numa
# segunda de feriado nacional em que ele pulou o próprio trabalho de
# propósito (ver `focus-resumo.yml` e `focus.feriados`). Por isso este
# workflow também checa por conta própria, como primeiro passo de trabalho:
# sem ela, ele reenviaria o HTML da semana anterior, que ainda está em
# output/focus/, como se fosse o boletim desta semana.

on:
  workflow_run:
    workflows: ["Resumo do Focus"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enviar:
    # Sem prosa nova não há boletim novo para mandar.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar se hoje é dia de rodar a rotina
        id: feriado
        run: |
          if python -m focus feriado; then
            echo "deve_executar=true" >> "$GITHUB_OUTPUT"
          else
            echo "deve_executar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Montar e enviar
        if: steps.feriado.outputs.deve_executar == 'true'
        env:
          FOCUS_SMTP_USER:         ${{ secrets.FOCUS_SMTP_USER }}
          FOCUS_SMTP_APP_PASSWORD: ${{ secrets.FOCUS_SMTP_APP_PASSWORD }}
          FOCUS_EMAIL_DEST:        ${{ secrets.FOCUS_EMAIL_DEST }}
          FOCUS_EMAIL_BCC:         ${{ secrets.FOCUS_EMAIL_BCC }}
        run: |
          python -m focus email \
            --url-dashboard "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Commitar o HTML enviado
        if: steps.feriado.outputs.deve_executar == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/focus/
          git diff --staged --quiet || git commit -m "chore: HTML do resumo enviado"
          git push
