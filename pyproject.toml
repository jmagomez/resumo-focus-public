[project]
name = "focus"
version = "2.0.0"
description = "Pipeline do Boletim Focus do Banco Central do Brasil"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "pdfplumber>=0.11,<0.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
# 3.11 é o piso porque a rotina agendada pode rodar em ambiente mais antigo que
# o do CI; o pacote não usa nada exclusivo de 3.12.
target-version = "py311"
extend-exclude = ["data", "output", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",    # comprimento de linha: o formatador já cuida
  "RUF001",  # caracteres unicode ambíguos: o projeto é em português
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# SIM117: aninhar `patch(...)` com `pytest.raises(...)` lê melhor do que
# combiná-los num único `with` de duas linhas.
"tests/*" = ["B011", "SIM117"]
